[project]
name = "detyra1-uninformed-search"
version = "1.0.0"
description = "Inteligjenca Artificiale 2026/27 - Detyra 1: kërkimi i painformuar (DFS, BFS, IDDFS me backtracking) dhe pemët e kërkimit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nehar Jashari" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

# Programi ekzekutohet nga rrënja e repository-t: python -m uninformed_search ...

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
